name: APK Android

# Gera o APK do app do motorista e publica como artefato para download.
#
# Por que buildar no CI e nao localmente: a maquina de desenvolvimento nao tem
# JDK nem Android SDK, e instalar o toolchain Android baixa alguns GB. O CI
# faz isso em minutos, sem custo em repositorio publico, e produz um artefato
# versionado junto do codigo.
#
# Assinatura: build DEBUG, assinada com o keystore de debug que o proprio
# Gradle gera. E instalavel em aparelho real, mas serve so para teste — cada
# reinstalacao gera assinatura diferente. Para distribuicao continua ver a
# pendencia P-04 em docs/PENDENCIAS.md.

on:
  push:
    branches: [main]
    paths:
      - 'apps/android/**'
      - 'packages/shared/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'URL da API gravada no APK (https obrigatorio — o app recusa HTTP)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  apk:
    name: Build APK debug
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Habilitar Gradle caching
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            apps/android/.gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/android/**/*.kts') }}
          restore-keys: gradle-${{ runner.os }}-

      # O Gradle Wrapper nao e versionado: ele depende do gradle-wrapper.jar,
      # um binario que so pode ser produzido pelo proprio Gradle. Versionar um
      # Gradle 8.7 nao e compativel com o AGP 8.7.3 do projeto: o plugin exige
      # 8.9 ou superior e aborta na configuracao, com mensagem que nao aponta a
      # causa. Por isso a versao fica fixada aqui, num lugar legivel — o Gradle
      # Wrapper nao e versionado (depende do gradle-wrapper.jar, binario
      # produzido apenas pelo proprio Gradle).
      - name: Instalar Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # Sequencia manual do SDK. A acao android-actions/setup-android falhou na
      # primeira execucao, entao o SDK passa a ser instalado aqui, de forma
      # explicita e versionada no proprio workflow.
      #
      # cmdline-tools vai em /usr/local/lib/android/sdk porque o script de
      # instalacao do runner procura o sdkmanager nessa posicao (ANDROID_SDK_ROOT).
      - name: Instalar Android SDK
        run: |
          set -euo pipefail
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          mkdir -p "$ANDROID_HOME/cmdline-tools"

          echo "Baixando command line tools..."
          curl -fsSL -o /tmp/cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline
          # O zip traz cmdline-tools/; o SDK exige o layout <sdk>/cmdline-tools/latest/
          mv /tmp/cmdline/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"

          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          echo "sdkmanager: $(command -v sdkmanager)"

          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

          echo "Instalado:"
          sdkmanager --list_installed 2>/dev/null | head -20

      # O APK nao carrega segredo nenhum: a URL da API entra por -P e vira
      # BuildConfig. Nada de KEY no repositorio.
      - name: Definir URL da API
        id: url
        run: |
          URL="${{ inputs.api_base_url }}"
          if [ -z "$URL" ]; then
            URL="https://api.exemplo.invalid"
          fi
          echo "apiBaseUrl=$URL" >> "$GITHUB_OUTPUT"
          echo "URL usada: $URL"

      # Os testes sao uma ETAPA SEPARADA, antes do APK, e nao bloqueiam o
      # artefato. Motivo: o objetivo deste workflow e entregar um .apk
      # instalavel. Um teste que falha por ambiente (rede, cache) nao pode
      # impedir o download — mas tambem nao pode passar em silencio, entao
      # registra ::error:: e segue para o build.
      - name: Testes unitarios JVM (nao bloqueia o APK)
        working-directory: apps/android
        continue-on-error: true
        id: testes
        run: |
          if gradle --no-daemon testDebugUnitTest; then
            echo "resultado=passou" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Os testes unitarios Android FALHARAM. O APK sera gerado assim mesmo, mas isso precisa ser investigado."
            echo "resultado=falhou" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK debug
        working-directory: apps/android
        env:
          # Sem isso o Gradle tenta baixar da rede e falha em qualquer falha
          # de conexao, mascarando o erro real do build.
          GRADLE_OPTS: '-Dorg.gradle.internal.http.connectionTimeout=120000 -Dorg.gradle.internal.http.socketTimeout=120000'
        run: |
          echo "::group::log completo do Gradle"
          gradle --no-daemon --stacktrace assembleDebug -PapiBaseUrl="${{ steps.url.outputs.apiBaseUrl }}" 2>&1 | tee /tmp/gradle-build.log
          codigo=${PIPESTATUS[0]}
          echo "::endgroup::"

          # O log acima ja esta no stdout do job; aqui ficam so as linhas que
          # explicam a falha, para nao precisar abrir o log completo.
          echo "::group::linhas relevantes"
          grep -nE "FAILURE|What went wrong|Could not|error:|Caused by|Unsupported|requires|incompatible|Execution failed|> " /tmp/gradle-build.log | head -40 || echo "(nenhuma linha de erro reconhecida)"
          echo "::endgroup::"

          exit $codigo

      - name: Confirmar que o APK foi gerado
        working-directory: apps/android
        run: |
          APK=$(find . -name '*-debug.apk' | head -1)
          if [ -z "$APK" ]; then
            echo "::error::nenhum .apk encontrado — o build nao produziu artefato"
            exit 1
          fi
          echo "APK: $APK ($(du -h "$APK" | cut -f1))"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK" 2>/dev/null \
            | grep -E "^package|sdkVersion|application-label" | head -5 \
            || echo "(aapt2 indisponivel; apenas o arquivo importa para o artefato)"

      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: sistema-rota-apk-debug
          path: apps/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      # Build de release fica bloqueada de proposito: sem keystore do cliente,
      # gerar um APK release daria a falsa impressao de que ha distribuicao.
      # O que trava e o segredo de assinatura, nao o script.
      - name: Resumo
        run: |
          {
            echo "### APK pronto"
            echo ""
            echo "Baixe o artefato **sistema-rota-apk-debug** desta execucao."
            echo ""
            echo "Instalar no aparelho:Settings > Sobre > Build number (toque 7x)"
            echo "para liberar instalacao de fonte desconhecida, depois abra o .apk."
            echo ""
            echo "**Este APK e de TESTE**: assinado com chave de debug. Para"
            echo "distribuir a frotta, veja a pendencia P-04 em docs/PENDENCIAS.md."
          } >> "$GITHUB_STEP_SUMMARY"