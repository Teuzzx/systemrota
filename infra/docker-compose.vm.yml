# Implantacao em uma VM (Oracle Cloud Always Free, VPS, servidor proprio).
#
# Diferenca para infra/docker-compose.yml: aqui NAO existe servico de banco.
# O PostgreSQL/PostGIS e o Supabase, acessado por rede. A VM roda so a API
# (e, opcionalmente, o painel).
#
# Por que a API nao fica no plano da Vercel: a Vercel executa funcoes
# serverless, sem processo Node continuo — o que o NestJS precisa (WebSocket
# do Socket.IO e pool de conexoes do Prisma).
#
# Uso:
#   docker compose -f infra/docker-compose.vm.yml --env-file .env up -d --build
#
# IMPORTANTE: a VM precisa liberar a porta no firewall do provedor E no iptables
# (ver docs/DEPLOY.md secao 0.7).

services:
  api:
    build:
      context: .
      dockerfile: infra/Dockerfile.api
    image: sistema-rota-api:latest
    container_name: rota-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # A VM escuta numa porta alta e o host mapeia para 4000.
      PORT: 4000
      DB_DRIVER: postgresql
      DB_TRANSPORT: engine
      DATABASE_URL: ${DATABASE_URL:?defina DATABASE_URL no .env}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?defina JWT_ACCESS_SECRET (min. 32 chars)}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      ROUTING_PROVIDER: ${ROUTING_PROVIDER:-heuristic}
      LOCATION_RETENTION_DAYS: ${LOCATION_RETENTION_DAYS:-90}
      AGGREGATE_RETENTION_DAYS: ${AGGREGATE_RETENTION_DAYS:-730}
      DEFAULT_SERVICE_SECONDS: ${DEFAULT_SERVICE_SECONDS:-900}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-300}
      RATE_LIMIT_AUTH_MAX: ${RATE_LIMIT_AUTH_MAX:-10}
    ports:
      # Ligado em 0.0.0.0 porque o trafego chega de fora (Vercel).
      # A API e autenticada em todas as rotas, mas ve-lo: se preferir so local,
      # troque por '127.0.0.1:4000:4000' e use um proxy reverso com TLS.
      - '4000:4000'
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:4000/api/docs-json || exit 1']
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  # Opcional: rodar o painel na propria VM, alem da Vercel.
  # Ative com:  --profile web
  web:
    profiles: ['web']
    build:
      context: .
      dockerfile: infra/Dockerfile.web
    image: sistema-rota-web:latest
    container_name: rota-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      API_INTERNAL_URL: http://api:4000
    ports:
      - '3000:3000'